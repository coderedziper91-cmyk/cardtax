<head>

  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">

  <meta name="theme-color" content="#14130f" media="(prefers-color-scheme: dark)">
  <meta name="description" content="The AI card scanner is coming soon — use manual entry or CSV import in the meantime.">
  <meta property="og:type" content="website">

  <meta name="twitter:card" content="summary_large_image">

<body>
  <div id="app-shell"></div>
  <script src="/static/shared.js"></script>
  <script>
    mountShell("scan");
    const content = document.getElementById("page-content");
    content.innerHTML = `
      <div class="page-header">
        <div>
          <div class="title">Card scanner</div>
          <div class="subtitle">Snap a card, get the player, year, set, and value in one tap.</div>
        </div>
        <span class="badge badge-warning">Coming soon</span>
      </div>

      <div class="card" style="text-align:center;padding:48px 32px">
        <div style="display:inline-flex;align-items:center;justify-content:center;width:72px;height:72px;border-radius:50%;background:var(--bg-secondary);border:1px solid var(--border);margin-bottom:20px;color:var(--text-secondary)">
          <svg viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
            <circle cx="12" cy="13" r="4"/>
          </svg>
        </div>
        <div class="card-title" style="font-size:22px;margin-bottom:8px">AI card scanner — coming soon</div>
        <p style="max-width:520px;margin:0 auto 24px;color:var(--text-secondary);line-height:1.6">
          We're putting the finishing touches on photo-based card identification.
          When it ships, you'll point your camera at a card and CardTax will fill
          in the player, year, set, parallel, and a fair-market value estimate
          automatically.
        </p>
        <p style="max-width:520px;margin:0 auto 28px;color:var(--text-secondary);line-height:1.6;font-size:14px">
          In the meantime, you can add cards manually or bulk-import a CSV from
          eBay, Whatnot, COMC, Mercari, or TCGplayer — every other CardTax
          feature works exactly the same.
        </p>
        <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
          <a href="/transactions" class="btn btn-primary">Add a card manually</a>
          <a href="/upload" class="btn btn-secondary">Import a CSV</a>
        </div>
      </div>

      <div class="card" style="margin-top:20px">
        <div class="card-title" style="margin-bottom:8px">What to expect</div>
        <ul style="margin:0;padding-left:20px;color:var(--text-secondary);line-height:1.8">
          <li>Works for Sports, Pokémon, MTG, and Yu-Gi-Oh!</li>
          <li>Auto-detects parallels, refractors, and serial numbers</li>
          <li>Pulls a fair-market value estimate so your basis is ready on day one</li>
          <li>Saves directly to your collection — no double entry</li>
        </ul>
      </div>
    `;
  </script>
