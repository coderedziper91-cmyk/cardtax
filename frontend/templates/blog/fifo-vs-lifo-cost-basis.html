        <h1>FIFO vs LIFO: Which Cost Basis Method Saves You the Most?</h1>
        <div class="article-meta">April 15, 2026 · 5 min read · Cost basis</div>

        <p>When you own multiple copies of the same card and sell one, the IRS needs to know <em>which one</em> you sold. That choice — the lot accounting method — changes your taxable gain. The three options for collectibles are <strong>FIFO</strong>, <strong>LIFO</strong>, and <strong>specific identification</strong>.</p>

        <h2>The three methods</h2>
        <h3>FIFO (First-In, First-Out)</h3>
        <p>The IRS default. When you sell, you assume you sold the oldest copy in your collection. This tends to surface long-term holding periods (older = more likely to be &gt;1 year held) and often the lowest cost basis (cards bought first are usually cheapest).</p>

        <h3>LIFO (Last-In, First-Out)</h3>
        <p>You assume you sold the most recent purchase. In a rising market, this means a smaller short-term gain on each sale — but the gain is short-term and taxed as ordinary income.</p>

        <h3>Specific identification</h3>
        <p>You pick exactly which copy was sold. Requires good records (a serial number, slab number, or PSA cert) but gives you the most control. Optimizers usually run this on high-value cards and FIFO on commons.</p>

        <h2>An example</h2>
        <p>Say you bought three 2018 Topps Chrome Acuña RC PSA 10s:</p>
        <ul>
          <li>March 2022, $180</li>
          <li>January 2023, $310</li>
          <li>December 2024, $450</li>
        </ul>
        <p>You sell one in April 2026 for $600 (net of fees).</p>
        <ul>
          <li><strong>FIFO:</strong> basis $180 → gain $420 (long-term, 28% collectibles rate).</li>
          <li><strong>LIFO:</strong> basis $450 → gain $150 (still long-term — held &gt;1 year — same 28% rate). LIFO wins here.</li>
          <li><strong>Specific ID:</strong> pick the $310 lot → gain $290 (long-term). Middle ground.</li>
        </ul>
        <p>In this case LIFO saves you $76 in federal tax. But change the holding period of the latest purchase to under a year and LIFO becomes <em>worse</em> — that gain is now ordinary income, often at a higher rate than 28%.</p>

        <div class="article-callout">
          CardTax computes all three methods side-by-side from the same dataset so you can compare. Set your preferred method in <a href="/settings">Settings</a>; the dashboard recalculates instantly.
        </div>

        <h2>Rules to remember</h2>
        <ul>
          <li><strong>Pick one and stick with it.</strong> Switching methods between tax years requires IRS Form 3115. Don't bounce around.</li>
          <li><strong>Specific ID requires identification at the time of sale.</strong> You can't choose retroactively when filing — pick the lot before the transaction settles.</li>
          <li><strong>Records matter.</strong> Without acquisition dates and prices on file, the IRS can disallow basis you claim, especially under LIFO or specific-ID.</li>
        </ul>

        <h2>Which one to pick</h2>
        <p>Most casual sellers use FIFO and rarely overpay — it's simple, the IRS default, and produces long-term gains more often. Active flippers with rising-market inventory and good records often benefit from LIFO or specific-ID. CardTax shows the actual dollar difference on your data, so you can see the trade-off before committing.</p>
