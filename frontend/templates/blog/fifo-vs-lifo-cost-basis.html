        <h1>FIFO vs LIFO: Which Cost Basis Method Saves You the Most?</h1>
        <div class="article-meta">April 15, 2026 · 5 min read · Cost basis</div>

        <p>When you own multiple copies of the same card and sell one, the IRS needs to know <em>which one</em> you sold. That choice — the lot accounting method — changes your taxable gain. Which methods you can use depends on whether you're treated as an <strong>investor</strong> (capital assets) or a <strong>dealer</strong> (inventory).</p>

        <h2>The methods, by classification</h2>

        <h3>If you're an investor: FIFO or specific identification</h3>
        <p>For capital-asset sales, the IRS recognizes only two methods. <strong>Specific identification</strong> lets you pick exactly which copy was sold — provided you can prove it with a serial number, slab cert, or other unique tag. If you can't identify a specific copy, <strong>FIFO</strong> (first-in, first-out) is the default: you're treated as having sold the oldest copy first. The model rule is Treas. Reg. §1.1012-1(c), written for securities; the IRS has consistently applied the same FIFO-or-specific-ID framework to other capital assets, including collectibles.</p>

        <h3>If you're a dealer: inventory accounting, including LIFO</h3>
        <p>Dealers — taxpayers in the trade or business of buying and selling cards — account for cards as <em>inventory</em> under §§471 and 472, not as capital assets. Inventory can be valued under FIFO, weighted average, or LIFO. <strong>LIFO requires a formal election on Form 970</strong> and brings the conformity rule with it (you have to use LIFO on your books too, not just for tax). Most card dealers don't bother — FIFO and specific-ID are simpler and the LIFO benefit rarely justifies the recordkeeping.</p>

        <h3>What that means in practice</h3>
        <p>If you read articles or forum posts saying "use LIFO to minimize short-term gains," they're describing inventory accounting that's only available to dealers who've made the election. An investor who sells a card can't just pick LIFO on their return.</p>

        <h2>An example (investor, two methods)</h2>
        <p>Say you bought three 2018 Topps Chrome Acuña RC PSA 10s:</p>
        <ul>
          <li>March 2022, $180</li>
          <li>January 2023, $310</li>
          <li>December 2024, $450</li>
        </ul>
        <p>You sell one in April 2026 for $600 (net of fees).</p>
        <ul>
          <li><strong>FIFO (default):</strong> basis $180 → gain $420 (long-term, 28% collectibles cap).</li>
          <li><strong>Specific ID — pick the $450 lot:</strong> gain $150 (still long-term — held &gt;1 year — same 28% rate). Saves about $76 federal vs. FIFO.</li>
          <li><strong>Specific ID — pick the $310 lot:</strong> gain $290 (long-term). Middle ground.</li>
        </ul>
        <p>Specific identification gives you the optimization, not LIFO. You just need the documentation to prove <em>which</em> copy you sold before the transaction settles.</p>

        <div class="article-callout">
          CardTax computes FIFO and specific-ID side-by-side from the same dataset so you can compare. Set your preferred method in <a href="/settings">Settings</a>; the dashboard recalculates instantly.
        </div>

        <h2>Rules to remember</h2>
        <ul>
          <li><strong>Specific ID requires identification at the time of sale.</strong> You can't choose retroactively when filing — pick the lot before the transaction settles, and keep the records to back it up.</li>
          <li><strong>Records matter.</strong> Without acquisition dates and prices on file, the IRS can disallow basis you claim — and the worst case is being taxed on the full sale price.</li>
          <li><strong>Dealers electing LIFO file Form 970</strong> and must use LIFO on their books too. Changing inventory methods later requires Form 3115.</li>
        </ul>

        <h2>Which one to pick</h2>
        <p>For most card sellers — investors and hobbyists — FIFO is the default and rarely the worst answer. If you have high-value cards with documentation that lets you specifically identify which copy was sold, specific ID is the lever that actually reduces your bill. Dealers running real inventory should talk to a CPA about whether a LIFO election makes sense given the conformity rule and the recordkeeping load.</p>
