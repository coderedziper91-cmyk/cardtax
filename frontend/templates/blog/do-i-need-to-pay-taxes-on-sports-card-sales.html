        <h1>Do I Need to Pay Taxes on Sports Card Sales?</h1>
        <div class="article-meta">May 1, 2026 · 4 min read · Taxes 101</div>

        <p><strong>Short answer:</strong> yes, almost always. If you sell a card for more than you paid, the gain is taxable income — whether you sold it on eBay, Whatnot, COMC, or face-to-face at a card show.</p>

        <h2>How the IRS classifies cards</h2>
        <p>For federal tax purposes, sports cards (and trading cards generally) are <strong>collectibles</strong> under IRC §408(m). That distinction matters: long-term gains on collectibles are capped at <strong>28%</strong>, rather than the 15–20% preferential rate that applies to stocks.</p>

        <p>Your tax treatment depends on which of three buckets you fall into:</p>
        <ul>
          <li><strong>Hobbyist</strong> — you sell occasionally for fun. Gains are taxable on Schedule 1; you generally cannot deduct expenses or losses since TCJA suspended miscellaneous itemized deductions.</li>
          <li><strong>Investor</strong> — you hold cards expecting appreciation. Gains and losses are reported on Schedule D / Form 8949.</li>
          <li><strong>Dealer</strong> — buying and selling cards is your trade or business. Sales are ordinary income on Schedule C, and you can deduct ordinary business expenses (grading fees, supplies, shipping, mileage). The trade-off is paying self-employment tax.</li>
        </ul>

        <div class="article-callout">
          Not sure which one applies to you? The IRS uses a 9-factor test from Treas. Reg. §1.183-2. CardTax's <a href="/quiz">classification quiz</a> walks through them so you don't have to guess.
        </div>

        <h2>What about the $600 1099-K threshold?</h2>
        <p>Starting in tax year 2026, payment platforms (eBay, Whatnot, PayPal, Venmo for goods, etc.) must issue a Form 1099-K once gross payments cross $600 in a calendar year. A handful of states already require $600 reporting — MA, VT, VA, MD, IL, NJ, and DC.</p>
        <p>Two things to remember:</p>
        <ul>
          <li>The 1099-K reports <em>gross sales</em>, not your gain. Your actual tax owed is on the profit after subtracting cost basis and fees.</li>
          <li>The tax liability exists even if you don't receive a 1099-K. The form is paperwork; the obligation is yours regardless.</li>
        </ul>

        <h2>What you owe depends on cost basis</h2>
        <p>Cost basis is what you subtract from the sale price before tax is calculated. It includes the original purchase price plus grading fees, shipping in, buyer's premiums, and any other expense of acquiring the card.</p>
        <p>Without records, the IRS can disallow basis you can't document — and you'd be taxed on the full sale price. The single most important habit for a card seller is keeping receipts.</p>

        <h2>What to do about it</h2>
        <ol>
          <li>Track every sale — including face-to-face — with date, sale price, fees, and platform.</li>
          <li>Save acquisition records: purchase invoices, grading receipts, shipping labels.</li>
          <li>Pick your classification (hobby, investor, dealer) and stay consistent.</li>
          <li>If your projected total tax bill exceeds $1,000, pay quarterly estimates to avoid an underpayment penalty.</li>
        </ol>
