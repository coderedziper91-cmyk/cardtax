        <h1>Understanding the $600 1099-K Threshold for Card Sellers</h1>
        <div class="article-meta">April 22, 2026 · 5 min read · Forms</div>

        <p>For tax year <strong>2026</strong>, the federal 1099-K threshold drops to <strong>$600</strong> in gross payments — down from the $2,500 phase-in level used for 2025. If you sell on eBay, Whatnot, PayPal, Venmo (for goods), Mercari, or any other payment platform, you'll almost certainly receive a 1099-K.</p>

        <h2>What is a 1099-K?</h2>
        <p>Form 1099-K is an informational return filed by payment settlement entities — the platforms and processors that move money to you. Box 1a reports the <em>gross</em> amount of payment transactions for the year, before any fees, refunds, or shipping discounts.</p>
        <p>Important: the platform also sends a copy to the IRS. So whatever appears in Box 1a is on the IRS's radar.</p>

        <h2>Why the IRS sees a bigger number than you took home</h2>
        <p>A 1099-K reports the gross sale. Your tax is computed on net gain. The two are very different:</p>
        <ul>
          <li><strong>Gross sales</strong> (1099-K Box 1a): sale price × quantity, plus shipping the buyer paid.</li>
          <li><strong>Net proceeds</strong>: gross sales minus platform fees minus shipping you paid out.</li>
          <li><strong>Taxable gain</strong>: net proceeds minus your cost basis (purchase price + grading + acquisition costs).</li>
        </ul>
        <p>A $5,000 1099-K can easily translate to a $1,200 taxable gain — or even a loss. The form is a starting point, not a tax bill.</p>

        <div class="article-callout">
          CardTax reconciles 1099-Ks for you. Import the gross sales report, attach cost basis, and it produces Schedule D / Form 8949 rows that match what the IRS already has.
        </div>

        <h2>State thresholds may be lower</h2>
        <p>Several states require 1099-K reporting at lower thresholds, regardless of the federal number:</p>
        <ul>
          <li>$600: MA, VT, VA, MD, IL, NJ, DC</li>
          <li>$1,000: AR (with $0 if 4+ transactions)</li>
          <li>Various other thresholds in MO, RI, etc.</li>
        </ul>
        <p>If you live in or sell into one of these states, you may receive a state-issued 1099-K even when you're under the federal cap.</p>

        <h2>What if my 1099-K is wrong?</h2>
        <p>The most common errors: refunded sales reported as gross, or duplicates from a platform that consolidated multiple sub-accounts. Two options:</p>
        <ol>
          <li>Contact the platform to request a corrected 1099-K (best path).</li>
          <li>Report the gross 1099-K amount and back out the error with a clearly-labeled adjustment on Schedule 1 line 8z.</li>
        </ol>

        <h2>What to do this season</h2>
        <ol>
          <li>Match every 1099-K to your imports. CardTax flags duplicates and totals each platform separately.</li>
          <li>Track cost basis for every card you've sold — the IRS sees the gross, but you owe on the net.</li>
          <li>If you sell across multiple platforms, expect <em>multiple</em> 1099-Ks. They don't add up automatically.</li>
        </ol>
