        <h1>The 1099-K Threshold After OBBBA: $20,000 AND 200 Transactions</h1>
        <div class="article-meta">April 22, 2026 · 6 min read · Forms</div>

        <p>The One Big Beautiful Bill Act (OBBBA) <strong>repealed</strong> the American Rescue Plan Act's $600 1099-K trigger and <strong>restored the original IRC §6050W threshold</strong>: a payment platform only has to issue Form 1099-K if a seller exceeds <strong>both</strong> $20,000 in gross payments <strong>and</strong> 200 transactions on that single platform in the calendar year. The change is <strong>retroactive to tax year 2022</strong>.</p>

        <p>That sounds like good news for small sellers. It isn't quite. The threshold change affects <em>paperwork</em>, not your <em>tax liability</em>. Every dollar of profit on a card sale is still fully taxable — exactly as it always was.</p>

        <h2>What changed, in one paragraph</h2>
        <p>ARPA (signed in 2021) lowered the 1099-K threshold from $20,000 + 200 transactions to $600 with no transaction count, effective tax year 2022. The IRS delayed enforcement multiple times. OBBBA, signed in 2025, has now wiped ARPA's change out of the books entirely. For 2022, 2023, 2024, 2025, 2026, and going forward, the federal threshold is the original $20,000 AND 200 transactions — both conditions required.</p>

        <h2>What a 1099-K actually is</h2>
        <p>Form 1099-K is an informational return filed by payment settlement entities — the platforms and processors that move money to you (eBay, Whatnot, PayPal, Venmo for goods, Stripe, etc.). Box 1a reports the <em>gross</em> amount of payment transactions for the year, before any fees, refunds, or shipping discounts.</p>
        <p>Important: the platform also sends a copy to the IRS. So whatever appears in Box 1a is on the IRS's radar.</p>

        <h2>Why "no 1099-K" does not mean "no tax"</h2>
        <p>This is the single biggest misconception we see, and it has just gotten worse with the OBBBA news cycle. The 1099-K threshold determines whether the <em>platform</em> has to file a form. It does not determine whether <em>you</em> owe tax.</p>
        <ul>
          <li>Sold 50 cards on eBay for a $3,000 profit? Taxable.</li>
          <li>Flipped a $400 Charizard for $2,000 on Whatnot? The $1,600 gain is taxable.</li>
          <li>Sold cards for cash at a card show? Taxable.</li>
          <li>Did $19,000 across 180 eBay transactions and got no form? Every dollar of profit is still taxable.</li>
        </ul>
        <p>The IRS receives aggregate platform reporting through several other channels even without a 1099-K. And there is no statute of limitations on unfiled or fraudulent returns. The form is paperwork; the tax obligation is yours regardless.</p>

        <h2>Why the IRS sees a bigger number than you took home</h2>
        <p>When you <em>do</em> get a 1099-K, it reports the gross sale. Your tax is computed on net gain. The two are very different:</p>
        <ul>
          <li><strong>Gross sales</strong> (1099-K Box 1a): sale price × quantity, plus shipping the buyer paid.</li>
          <li><strong>Net proceeds</strong>: gross sales minus platform fees minus shipping you paid out.</li>
          <li><strong>Taxable gain</strong>: net proceeds minus your cost basis (purchase price + grading + acquisition costs).</li>
        </ul>
        <p>A $25,000 1099-K can easily translate to a $4,000 taxable gain — or even a loss. The form is a starting point, not a tax bill.</p>

        <div class="article-callout">
          CardTax reconciles 1099-Ks for you. Import the gross sales report, attach cost basis, and it produces Schedule D / Form 8949 rows that match what the IRS already has — at the right collectibles rate.
        </div>

        <h2>State thresholds are still lower in many places</h2>
        <p>Several states set their own 1099-K reporting thresholds below the federal $20k/200 line. If you live in or sell into one of these states, you may receive a state-issued 1099-K even when you are under the federal cap:</p>
        <ul>
          <li>$600: MA, VT, VA, MD, IL, NJ, DC</li>
          <li>$1,000: AR (with $0 if 4+ transactions)</li>
          <li>Various other thresholds in MO, RI, etc.</li>
        </ul>

        <h2>The collectibles complication the threshold has nothing to do with</h2>
        <p>Cards are collectibles under IRC §408(m). Long-term gains on collectibles are taxed at up to <strong>28%</strong> — meaningfully higher than the 0/15/20% brackets that apply to stocks. Short-term gains stack with ordinary income. None of this changes based on whether you got a 1099-K. Software that treats card sales as ordinary Schedule D capital gains gets the rate wrong.</p>

        <h2>What if my 1099-K is wrong?</h2>
        <p>The most common errors: refunded sales reported as gross, or duplicates from a platform that consolidated multiple sub-accounts. Two options:</p>
        <ol>
          <li>Contact the platform to request a corrected 1099-K (best path).</li>
          <li>Report the gross 1099-K amount and back out the error with a clearly-labeled adjustment on Schedule 1 line 8z.</li>
        </ol>

        <h2>What to do this season</h2>
        <ol>
          <li>Do not let the OBBBA news fool you — report every gain whether or not you receive a form.</li>
          <li>Match every 1099-K you do receive to your imports. CardTax flags duplicates and totals each platform separately.</li>
          <li>Track cost basis for every card you've sold — the IRS may see only the gross, but you owe tax on the net.</li>
          <li>If you sell across multiple platforms, expect <em>multiple</em> 1099-Ks once you cross both conditions on any one of them. They don't add up automatically.</li>
        </ol>
