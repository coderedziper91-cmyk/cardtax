<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Refund policy · CardTax</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#faf8f3" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#14130f" media="(prefers-color-scheme: dark)">
  <meta name="description" content="CardTax refund and cancellation policy.">
  <link rel="canonical" href="https://cardtax.app/refund-policy">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="CardTax">
  <meta property="og:title" content="Refund policy">
  <meta property="og:description" content="CardTax refund and cancellation policy.">
  <meta property="og:image" content="/static/og-image.png">
  <link rel="stylesheet" href="/static/app.css">
  <style>
    .legal { max-width: 680px; margin: 0 auto; }
    .legal h3 {
      font-family: var(--font-display);
      font-size: 19px; font-weight: 500;
      letter-spacing: -0.015em; color: var(--ink);
      margin: 36px 0 10px;
    }
    .legal p, .legal li {
      color: var(--ink-soft); font-size: 14.5px;
      line-height: 1.7; margin: 0 0 12px;
    }
    .legal ul { padding-left: 18px; margin: 0 0 12px; }
    .legal a { color: var(--accent); border-bottom: 1px solid var(--accent-soft); }
  </style>
  <script src="/static/analytics.js" defer></script>
</head>
<body>
  <div id="app-shell"></div>
  <script src="/static/shared.js"></script>
  <script>
    mountShell("refund-policy");
    document.getElementById("page-content").innerHTML = `
      <div class="legal">
        <div class="page-header">
          <div>
            <div class="eyebrow">Legal</div>
            <div class="title" style="margin-top:8px">Refund &amp; cancellation policy</div>
            <div class="subtitle">Last updated: ${new Date().toLocaleDateString("en-US", { year: "numeric", month: "long", day: "numeric" })}</div>
          </div>
        </div>

        <h3>Cancellation</h3>
        <p>You can cancel any paid CardTax plan at any time from the <a href="/account">Account</a> page → "Manage billing." Cancelling stops the next renewal; your paid features remain active until the end of the current billing period.</p>

        <h3>Refunds</h3>
        <p>We offer a <strong>7-day money-back guarantee</strong> for new subscribers: if you cancel within seven calendar days of your first paid charge and have not exported any tax forms, we will refund the charge in full upon request.</p>
        <p>Beyond the first 7 days, paid plans are non-refundable. You can still cancel renewal at any time — billing simply stops at the end of the paid period.</p>
        <p>Annual plans are pro-rated when downgraded mid-cycle: the unused portion is converted to credit toward future charges. Cash refunds for annual plans are at the discretion of CardTax.</p>

        <h3>Exceptions</h3>
        <ul>
          <li>Duplicate charges or billing errors are refunded promptly and in full.</li>
          <li>If CardTax has a service outage of more than 48 hours within a billing period, contact support for a pro-rated credit.</li>
          <li>Refunds are not available for the Free plan (it costs nothing) or for accounts terminated for terms-of-service violations.</li>
        </ul>

        <h3>How to request a refund</h3>
        <p>Open the in-app chat widget and click <strong>"Talk to a person"</strong>, or reply to your CardTax receipt email. Include the email on your account and the date of the charge you want refunded. We respond within one business day.</p>

        <h3>Data after cancellation</h3>
        <p>Your data stays in your account when you cancel — you keep read access to past transactions on the Free plan, subject to the 25-transaction limit. To permanently delete every record, use the <strong>"Delete account"</strong> button in <a href="/account">Account settings</a>.</p>

        <h3>Contact</h3>
        <p>Questions about a refund or cancellation? Email <a href="mailto:support@cardtax.app">support@cardtax.app</a> or use the in-app chat.</p>
      </div>
    `;
  </script>
</body>
</html>
