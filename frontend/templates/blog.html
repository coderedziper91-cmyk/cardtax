  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">

<body>
  <div id="app-shell"></div>
  <script src="/static/shared.js"></script>
  <script>
    mountShell("blog");

    const POSTS = [
      {
        slug: "do-i-need-to-pay-taxes-on-sports-card-sales",
        title: "Do I Need to Pay Taxes on Sports Card Sales?",
        excerpt: "Short answer: yes, almost always. Here's how the IRS treats card sales — the 28% collectibles rate, the hobby/investor/dealer split, and why a 1099-K (or the absence of one) doesn't decide your tax bill.",
        date: "2026-05-01",
        minutes: 4,
      },
      {
        slug: "1099-k-threshold-for-card-sellers",
        title: "The 1099-K Threshold After OBBBA: $20,000 AND 200 Transactions",
        excerpt: "The One Big Beautiful Bill Act repealed the ARPA $600 trigger and restored the original $20,000 + 200-transaction threshold retroactively to 2022. Here's what that does and does not change for card sellers.",
        date: "2026-04-22",
        minutes: 6,
      },
      {
        slug: "fifo-vs-lifo-cost-basis",
        title: "FIFO vs LIFO: Which Cost Basis Method Saves You the Most?",
        excerpt: "FIFO is the IRS default for investors; specific identification gives you the optimization. LIFO is a dealer-only inventory election, not a free choice for collectors. Here's how to pick.",
        date: "2026-04-15",
        minutes: 5,
      },
    ];

    const fmtPostDate = d => new Date(d).toLocaleDateString("en-US", { month: "long", day: "numeric", year: "numeric" });

    document.getElementById("page-content").innerHTML = `
      <div style="max-width:780px">
        <div class="page-header">
          <div>
            <div class="eyebrow">Guides</div>
            <div class="title" style="margin-top:8px">CardTax Blog</div>
            <div class="subtitle">Plain-English tax guides for sports-card, Pokémon, and trading-card sellers. Written by people who've reconciled their own multi-platform basis at the 28% collectibles rate.</div>
          </div>
        </div>

        <div class="blog-list">
          ${POSTS.map(p => `
            <article class="blog-card">
              <div class="meta">${fmtPostDate(p.date)} · ${p.minutes} min read</div>
              <h3><a href="/blog/${p.slug}">${p.title}</a></h3>
              <p>${p.excerpt}</p>
              <div style="margin-top:10px"><a href="/blog/${p.slug}" class="muted" style="font-size:13px;text-decoration:underline">Read article →</a></div>
            </article>
          `).join("")}
        </div>
      </div>
    `;
  </script>
</body>
