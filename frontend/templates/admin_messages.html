<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Messages · CardTax Admin</title>
  <meta name="robots" content="noindex,nofollow">
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
  <meta name="theme-color" content="#faf8f3" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#14130f" media="(prefers-color-scheme: dark)">
  <meta name="description" content="CardTax admin chat console.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="CardTax">
  <meta property="og:title" content="Admin messages">
  <meta property="og:description" content="CardTax admin chat console.">
  <meta property="og:image" content="/static/og-image.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Admin messages">
  <meta name="twitter:description" content="CardTax admin chat console.">
  <meta name="twitter:image" content="/static/og-image.png">
  <link rel="stylesheet" href="/static/app.css">
  <style>
    .msg-layout {
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 24px;
      align-items: start;
    }
    @media (max-width: 920px) {
      .msg-layout { grid-template-columns: 1fr; }
    }
    .thread-list {
      border: 1px solid var(--rule);
      border-radius: var(--radius);
      background: var(--paper);
      max-height: calc(100vh - 260px);
      overflow-y: auto;
    }
    .thread-row {
      display: block;
      padding: 14px 16px;
      border-bottom: 1px solid var(--rule);
      cursor: pointer;
      text-decoration: none;
      color: inherit;
    }
    .thread-row:last-child { border-bottom: none; }
    .thread-row:hover { background: var(--paper-alt); }
    .thread-row.active { background: var(--accent-soft); }
    .thread-row-top {
      display: flex; align-items: center; justify-content: space-between;
      gap: 8px; margin-bottom: 4px;
    }
    .thread-email {
      font-size: 13px; font-weight: 500; color: var(--ink);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .thread-time { font-family: var(--font-mono); font-size: 10.5px; color: var(--ink-mute); }
    .thread-preview {
      font-size: 12.5px; color: var(--ink-soft); line-height: 1.4;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .thread-flags {
      display: inline-flex; gap: 6px; margin-top: 6px;
    }
    .flag {
      font-family: var(--font-mono); font-size: 10px; font-weight: 500;
      letter-spacing: 0.06em; text-transform: uppercase;
      padding: 2px 6px; border-radius: 2px;
      background: var(--paper-alt); color: var(--ink-mute);
      border: 1px solid var(--rule);
    }
    .flag-needs { color: var(--loss); background: var(--loss-soft); border-color: transparent; }
    .flag-unread { color: var(--accent); background: var(--accent-soft); border-color: transparent; }

    .thread-detail {
      border: 1px solid var(--rule);
      border-radius: var(--radius);
      background: var(--paper);
      padding: 20px;
      min-height: 320px;
    }
    .thread-header {
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px; padding-bottom: 16px; margin-bottom: 16px;
      border-bottom: 1px solid var(--rule);
    }
    .thread-header h3 {
      font-family: var(--font-display); font-size: 19px; font-weight: 500;
      letter-spacing: -0.01em;
    }
    .thread-messages {
      display: flex; flex-direction: column; gap: 12px;
      max-height: 460px; overflow-y: auto; padding-right: 4px;
    }
    .msg-row { display: flex; gap: 10px; max-width: 88%; }
    .msg-row.user  { align-self: flex-start; }
    .msg-row.bot   { align-self: flex-start; }
    .msg-row.admin { align-self: flex-end; }
    .msg-bubble {
      padding: 9px 13px;
      border-radius: 8px;
      font-size: 13.5px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-wrap: break-word;
      border: 1px solid var(--rule);
      background: var(--paper-alt);
      color: var(--ink);
    }
    .msg-row.bot   .msg-bubble { background: var(--paper); border-style: dashed; }
    .msg-row.admin .msg-bubble {
      background: var(--accent); color: var(--paper); border-color: var(--accent);
    }
    .msg-meta {
      font-family: var(--font-mono); font-size: 10.5px; color: var(--ink-mute);
      margin-top: 4px;
    }
    .reply-box { margin-top: 18px; }
    .reply-box textarea {
      width: 100%; min-height: 90px; resize: vertical;
      font-family: var(--font-sans); font-size: 13.5px;
    }
    .reply-actions {
      display: flex; justify-content: space-between; align-items: center;
      margin-top: 10px;
    }
    .empty-thread {
      text-align: center; padding: 60px 20px; color: var(--ink-mute);
      font-size: 13.5px;
    }
    .summary-strip {
      display: flex; gap: 18px; flex-wrap: wrap;
      font-size: 12.5px; color: var(--ink-mute);
      margin-top: 4px;
    }
    .summary-strip strong { color: var(--ink); font-family: var(--font-mono); font-weight: 500; }
  </style>
  <script src="/static/analytics.js" defer></script>
</head>
<body>
<div class="app-shell">
  <header class="topbar">
    <div class="topbar-inner">
      <a href="/dashboard" class="brand">CardTax</a>
      <nav class="nav">
        <a href="/" class="nav-link">Landing</a>
        <a href="/dashboard" class="nav-link">Dashboard</a>
        <a href="/admin" class="nav-link">Waitlist</a>
        <a href="/admin/messages" class="nav-link active">Messages</a>
      </nav>
    </div>
  </header>

  <main class="main">
    <div class="page">
      <div class="page-header">
        <div>
          <div class="eyebrow">Internal</div>
          <div class="title" style="margin-top:8px">Customer messages</div>
          <div class="subtitle" id="subtitle">Loading…</div>
          <div class="summary-strip" id="summary-strip"></div>
        </div>
        <div class="page-header-actions">
          <input type="password" class="input" id="token" placeholder="Admin token (if set)" style="width:240px" autocomplete="off">
          <select class="select" id="filter">
            <option value="unanswered">Needs reply</option>
            <option value="unread">Unread</option>
            <option value="all">All threads</option>
          </select>
          <button class="btn btn-secondary" id="reload">Reload</button>
        </div>
      </div>

      <div id="error" class="note note-danger" style="display:none;margin-bottom:24px"></div>

      <div class="msg-layout">
        <div class="thread-list" id="thread-list">
          <div class="empty-thread">Loading threads…</div>
        </div>
        <div class="thread-detail" id="thread-detail">
          <div class="empty-thread">Select a conversation to view it.</div>
        </div>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="footer-inner">
      <span>© <span id="yr"></span> CardTax · Admin</span>
    </div>
  </footer>
</div>

<script>
  document.getElementById("yr").textContent = new Date().getFullYear();

  const saved = localStorage.getItem("cardtax-theme");
  const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
  if (saved === "dark" || (saved !== "light" && prefersDark)) {
    document.documentElement.classList.add("dark");
  }

  const TOKEN_KEY = "cardtax-admin-token";
  const tokenInput = document.getElementById("token");
  tokenInput.value = sessionStorage.getItem(TOKEN_KEY) || "";

  let THREADS = [];
  let ACTIVE_USER_ID = null;

  function authHeaders() {
    const tok = tokenInput.value.trim();
    sessionStorage.setItem(TOKEN_KEY, tok);
    return tok ? { "x-admin-token": tok } : {};
  }

  function fmtDate(d) {
    if (!d) return "—";
    const dt = new Date(d);
    if (isNaN(dt.getTime())) return d;
    const now = new Date();
    const sameDay = dt.toDateString() === now.toDateString();
    if (sameDay) {
      return dt.toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" });
    }
    return dt.toLocaleDateString("en-US", { month: "short", day: "numeric" });
  }
  function fmtDateLong(d) {
    if (!d) return "—";
    const dt = new Date(d);
    if (isNaN(dt.getTime())) return d;
    return dt.toLocaleString("en-US", {
      year: "numeric", month: "short", day: "numeric",
      hour: "numeric", minute: "2-digit",
    });
  }

  function renderList() {
    const list = document.getElementById("thread-list");
    if (!THREADS.length) {
      list.innerHTML = `<div class="empty-thread">No conversations match this filter.</div>`;
      return;
    }
    list.innerHTML = THREADS.map(t => {
      const flags = [];
      if (t.needs_human) flags.push(`<span class="flag flag-needs">Needs reply</span>`);
      if (t.unread_admin_count > 0) flags.push(`<span class="flag flag-unread">${t.unread_admin_count} unread</span>`);
      return `
        <a class="thread-row ${t.user_id === ACTIVE_USER_ID ? "active" : ""}" data-uid="${t.user_id}" href="#user-${t.user_id}">
          <div class="thread-row-top">
            <div class="thread-email">${t.user_email || "user " + t.user_id}</div>
            <div class="thread-time">${fmtDate(t.last_at)}</div>
          </div>
          <div class="thread-preview">${escapeHtml(t.last_preview || "(no messages)")}</div>
          ${flags.length ? `<div class="thread-flags">${flags.join("")}</div>` : ""}
        </a>
      `;
    }).join("");
    list.querySelectorAll(".thread-row").forEach(el => {
      el.addEventListener("click", e => {
        e.preventDefault();
        ACTIVE_USER_ID = parseInt(el.dataset.uid);
        renderList();
        renderDetail();
      });
    });
  }

  function renderDetail() {
    const detail = document.getElementById("thread-detail");
    const thread = THREADS.find(t => t.user_id === ACTIVE_USER_ID);
    if (!thread) {
      detail.innerHTML = `<div class="empty-thread">Select a conversation to view it.</div>`;
      return;
    }
    const isUnread = thread.unread_admin_count > 0;
    detail.innerHTML = `
      <div class="thread-header">
        <div>
          <h3>${thread.user_email || "user " + thread.user_id}</h3>
          <div class="muted" style="font-size:12.5px;margin-top:2px">
            ${thread.message_count} message${thread.message_count === 1 ? "" : "s"} ·
            user id <span class="mono">${thread.user_id}</span>
          </div>
        </div>
        <div class="btn-group">
          <button class="btn btn-ghost btn-sm" id="mark-toggle">${isUnread ? "Mark as read" : "Mark unread"}</button>
        </div>
      </div>
      <div class="thread-messages" id="thread-messages">
        ${thread.messages.map(m => renderBubble(m)).join("")}
      </div>
      <div class="reply-box">
        <textarea class="textarea" id="reply-text" placeholder="Reply to this user — they'll see it in their chat widget."></textarea>
        <div class="reply-actions">
          <div class="muted" style="font-size:12px">Sending posts as an admin reply.</div>
          <button class="btn btn-primary" id="send-reply">Send reply</button>
        </div>
      </div>
    `;
    document.getElementById("mark-toggle").addEventListener("click", () => markRead(!isUnread));
    document.getElementById("send-reply").addEventListener("click", sendReply);
    const mc = document.getElementById("thread-messages");
    mc.scrollTop = mc.scrollHeight;
  }

  function renderBubble(m) {
    let label = "User";
    if (m.role === "bot") label = "Auto-reply";
    if (m.role === "admin") label = "You";
    const meta = `${label} · ${fmtDateLong(m.created_at)}${m.matched_kb_key ? " · KB: " + m.matched_kb_key : ""}`;
    return `
      <div class="msg-row ${m.role}">
        <div>
          <div class="msg-bubble">${escapeHtml(m.content)}</div>
          <div class="msg-meta">${meta}</div>
        </div>
      </div>
    `;
  }

  function escapeHtml(s) {
    return String(s || "").replace(/[&<>"']/g, c =>
      ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"})[c]);
  }

  async function sendReply() {
    const txt = document.getElementById("reply-text").value.trim();
    if (!txt) return;
    const btn = document.getElementById("send-reply");
    btn.disabled = true; btn.textContent = "Sending…";
    try {
      const r = await fetch(`/api/admin/messages/${ACTIVE_USER_ID}/reply`, {
        method: "POST",
        headers: { "Content-Type": "application/json", ...authHeaders() },
        body: JSON.stringify({ content: txt }),
      });
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      document.getElementById("reply-text").value = "";
      await load();
    } catch (e) {
      alert("Failed to send: " + e.message);
    } finally {
      btn.disabled = false; btn.textContent = "Send reply";
    }
  }

  async function markRead(read) {
    try {
      await fetch(`/api/admin/messages/${ACTIVE_USER_ID}/mark`, {
        method: "POST",
        headers: { "Content-Type": "application/json", ...authHeaders() },
        body: JSON.stringify({ read }),
      });
      await load();
    } catch (e) {
      alert("Failed: " + e.message);
    }
  }

  async function load() {
    const err = document.getElementById("error");
    err.style.display = "none";
    const filter = document.getElementById("filter").value;
    try {
      const r = await fetch(`/api/admin/messages?filter=${encodeURIComponent(filter)}`, {
        headers: authHeaders(),
      });
      if (r.status === 401) {
        err.textContent = "Admin token required. Set CARDTAX_ADMIN_TOKEN on the server and enter it above.";
        err.style.display = "block";
        document.getElementById("subtitle").textContent = "Unauthorized";
        return;
      }
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      const data = await r.json();
      THREADS = data.threads || [];
      const c = data.counts || {};
      document.getElementById("subtitle").textContent =
        `${THREADS.length} thread${THREADS.length === 1 ? "" : "s"} shown`;
      document.getElementById("summary-strip").innerHTML = `
        <span>Threads: <strong>${c.total_threads || 0}</strong></span>
        <span>Need reply: <strong>${c.unanswered_threads || 0}</strong></span>
        <span>Unread user messages: <strong>${c.unread_user_messages || 0}</strong></span>
      `;
      if (ACTIVE_USER_ID && !THREADS.find(t => t.user_id === ACTIVE_USER_ID)) {
        ACTIVE_USER_ID = null;
      }
      if (!ACTIVE_USER_ID && THREADS.length) {
        ACTIVE_USER_ID = THREADS[0].user_id;
      }
      renderList();
      renderDetail();
    } catch (e) {
      err.textContent = "Failed to load messages: " + e.message;
      err.style.display = "block";
      document.getElementById("subtitle").textContent = "Error";
    }
  }

  document.getElementById("reload").addEventListener("click", load);
  document.getElementById("token").addEventListener("change", load);
  document.getElementById("filter").addEventListener("change", load);

  load();
</script>
</body>
</html>
