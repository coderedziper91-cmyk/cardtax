<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset password · CardTax</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
  <meta name="theme-color" content="#faf8f3" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#14130f" media="(prefers-color-scheme: dark)">
  <meta name="description" content="Reset your CardTax password.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="CardTax">
  <meta property="og:title" content="Reset your password">
  <meta property="og:description" content="Reset your CardTax password.">
  <meta property="og:image" content="https://cardtax.app/static/og-image.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Reset your password">
  <meta name="twitter:description" content="Reset your CardTax password.">
  <meta name="twitter:image" content="https://cardtax.app/static/og-image.png">
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/analytics.js" defer></script>
</head>
<body>
  <div class="auth-shell">
    <header class="auth-topbar">
      <a href="/" class="brand">CardTax</a>
      <a href="/login" class="muted" style="font-size:13px">Back to sign in →</a>
    </header>

    <main class="auth-main">
      <div class="auth-card">
        <h1 class="auth-title">Forgot password</h1>
        <p class="auth-sub">Enter your email and we'll send you a link to choose a new one.</p>

        <div id="error-banner" class="note note-danger" style="display:none;margin-bottom:18px"></div>

        <form id="forgot-form" autocomplete="on">
          <label class="field" style="margin-bottom:18px">
            <span class="field-label">Email</span>
            <input type="email" id="email" class="input" autocomplete="email" required>
          </label>
          <button class="btn btn-primary" id="submit" style="width:100%" type="submit">Send reset link</button>
        </form>

        <div id="success-block" style="display:none;margin-top:22px">
          <div class="note" style="border-left-color:var(--gain);margin-bottom:14px">
            <strong>Check your email.</strong> <span id="success-msg"></span>
          </div>
          <div id="dev-link-block" style="display:none">
            <div class="eyebrow" style="margin-bottom:8px">Dev mode · reset link</div>
            <div class="muted" style="font-size:12.5px;margin-bottom:8px">
              Email isn't wired up yet, so we're showing the link here. Open it to set a new password.
            </div>
            <div style="background:var(--paper-alt);border:1px solid var(--rule);padding:10px 12px;border-radius:var(--radius);font-family:var(--font-mono);font-size:12px;word-break:break-all">
              <a id="dev-link" href="#" target="_self"></a>
            </div>
          </div>
        </div>

        <div class="auth-foot muted">
          Remembered it? <a href="/login">Sign in</a>
        </div>
      </div>
    </main>

    <footer class="auth-footer muted">
      <span>© <span id="year"></span> CardTax</span>
      <span><a href="/terms">Terms</a> · <a href="/privacy">Privacy</a> · <a href="/pricing">Pricing</a></span>
    </footer>
  </div>

  <script>
    (function () {
      const saved = localStorage.getItem("cardtax-theme");
      const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
      if (saved === "dark" || (saved !== "light" && prefersDark)) {
        document.documentElement.classList.add("dark");
      }
    })();
    document.getElementById("year").textContent = new Date().getFullYear();

    function showError(msg) {
      const b = document.getElementById("error-banner");
      b.textContent = msg; b.style.display = "block";
    }
    function clearError() { document.getElementById("error-banner").style.display = "none"; }

    document.getElementById("forgot-form").addEventListener("submit", async e => {
      e.preventDefault();
      clearError();
      const email = document.getElementById("email").value.trim();
      const btn = document.getElementById("submit");
      btn.disabled = true; btn.textContent = "Sending…";
      try {
        const r = await fetch("/api/auth/forgot", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email }),
        });
        const data = await r.json().catch(() => ({}));
        if (!r.ok) throw new Error(data.detail || "Could not send reset link.");

        document.getElementById("forgot-form").style.display = "none";
        document.getElementById("success-block").style.display = "block";
        document.getElementById("success-msg").textContent =
          data.message || "If an account exists, a reset link has been sent.";

        if (data.dev_reset_link) {
          document.getElementById("dev-link-block").style.display = "block";
          const a = document.getElementById("dev-link");
          a.href = data.dev_reset_link;
          a.textContent = data.dev_reset_link;
        }
      } catch (err) {
        showError(err.message || "Could not send reset link.");
        btn.disabled = false; btn.textContent = "Send reset link";
      }
    });
  </script>
</body>
</html>
