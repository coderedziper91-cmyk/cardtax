<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard · CardTax</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
  <meta name="theme-color" content="#faf8f3" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#14130f" media="(prefers-color-scheme: dark)">
  <meta name="description" content="Your card-sale tax dashboard.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="CardTax">
  <meta property="og:title" content="CardTax">
  <meta property="og:description" content="Your card-sale tax dashboard.">
  <meta property="og:image" content="https://cardtax.app/static/og-image.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="CardTax">
  <meta name="twitter:description" content="Your card-sale tax dashboard.">
  <meta name="twitter:image" content="https://cardtax.app/static/og-image.png">
  <link rel="stylesheet" href="/static/app.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="/static/analytics.js" defer></script>
</head>
<body>
  <div id="app-shell"></div>
  <script src="/static/shared.js"></script>
  <script>
    mountShell("dashboard");

    const content = document.getElementById("page-content");
    content.innerHTML = `
      <div class="page-header">
        <div>
          <div class="eyebrow" id="tax-year-eyebrow">Tax Year 2026</div>
          <div class="title" style="margin-top:8px">Overview</div>
          <div class="subtitle" id="today-line"></div>
        </div>
        <div class="page-header-actions">
          <select class="select" id="year-select" style="width:auto"></select>
        </div>
      </div>

      <div id="empty-state" class="empty" style="display:none">
        <div class="empty-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4" width="18" height="16" rx="2"/>
            <line x1="3" y1="10" x2="21" y2="10"/>
            <line x1="9" y1="4" x2="9" y2="20"/>
          </svg>
        </div>
        <div class="empty-title">Import your first sale to get started</div>
        <div class="empty-sub">Connect eBay for auto-sync, upload a Whatnot CSV, or add a sale by hand — your dashboard fills out as soon as one transaction lands.</div>
        <div class="empty-ctas">
          <a href="/upload" class="btn btn-primary">Upload a CSV</a>
          <a href="/connections" class="btn btn-secondary">Connect a marketplace</a>
          <a href="/transactions" class="btn btn-ghost">Add manually →</a>
        </div>
      </div>

      <div id="dashboard-body" style="display:none">
        <div class="kpi-row">
          <div class="kpi">
            <div class="kpi-label">Gross Sales</div>
            <div class="kpi-value" id="k-sales">$0</div>
            <div class="kpi-sub" id="k-sales-sub"></div>
          </div>
          <div class="kpi">
            <div class="kpi-label">Cost Basis</div>
            <div class="kpi-value" id="k-basis">$0</div>
            <div class="kpi-sub" id="k-basis-sub"></div>
          </div>
          <div class="kpi">
            <div class="kpi-label">Net Gain / Loss</div>
            <div class="kpi-value" id="k-net">$0</div>
            <div class="kpi-delta" id="k-net-delta"></div>
          </div>
          <div class="kpi">
            <div class="kpi-label">Estimated Tax</div>
            <div class="kpi-value" id="k-tax">$0</div>
            <div class="kpi-sub" id="k-tax-sub"></div>
          </div>
        </div>

        <div class="grid grid-2-1 section">
          <div>
            <div class="section-header">
              <div>
                <div class="section-title">Realized portfolio</div>
                <div class="section-sub">Cumulative gain after fees and basis</div>
              </div>
              <div class="range-tabs" id="range-tabs">
                <button class="range-tab" data-r="30">30D</button>
                <button class="range-tab" data-r="90">90D</button>
                <button class="range-tab" data-r="365">1Y</button>
                <button class="range-tab active" data-r="all">All</button>
              </div>
            </div>
            <div style="height:280px"><canvas id="chart"></canvas></div>
          </div>

          <div>
            <div class="section-header">
              <div>
                <div class="section-title">What needs attention</div>
              </div>
            </div>
            <div id="action-items" class="action-list"></div>
          </div>
        </div>

        <div class="section">
          <div class="section-header">
            <div>
              <div class="section-title">Recent activity</div>
              <div class="section-sub">Last eight transactions</div>
            </div>
            <a href="/transactions" class="muted" style="font-size:13px">All transactions →</a>
          </div>
          <div style="overflow-x:auto">
            <table class="table table-compact">
              <thead><tr>
                <th>Date</th>
                <th>Item</th>
                <th>Platform</th>
                <th>Hold</th>
                <th class="num">Proceeds</th>
                <th class="num">Gain / loss</th>
              </tr></thead>
              <tbody id="recent-body"></tbody>
            </table>
          </div>
        </div>
      </div>
    `;

    document.getElementById("today-line").textContent =
      new Date().toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric", year: "numeric" });

    let CHART = null;
    let DASHBOARD = null;

    function drawChart(range) {
      const t = chartTheme();
      let pts = DASHBOARD.portfolio_series.points;
      if (range !== "all") {
        const days = parseInt(range);
        const cutoff = new Date(); cutoff.setDate(cutoff.getDate() - days);
        pts = pts.filter(p => new Date(p.date) >= cutoff);
      }
      const labels = pts.map(p => p.date);
      const data = pts.map(p => p.cum_gain);

      if (CHART) CHART.destroy();
      const ctx = document.getElementById("chart").getContext("2d");

      CHART = new Chart(ctx, {
        type: "line",
        data: { labels, datasets: [{
          data,
          borderColor: t.accent,
          backgroundColor: "transparent",
          tension: 0.18,
          fill: false,
          pointRadius: 0,
          pointHoverRadius: 4,
          pointHoverBackgroundColor: t.accent,
          pointHoverBorderColor: t.paper,
          pointHoverBorderWidth: 2,
          borderWidth: 1.25,
        }]},
        options: {
          maintainAspectRatio: false,
          interaction: { mode: "index", intersect: false },
          plugins: {
            legend: { display: false },
            tooltip: {
              backgroundColor: t.accent,
              titleColor: t.paper,
              bodyColor: t.paper,
              titleFont: { family: "-apple-system, sans-serif", size: 11, weight: "500" },
              bodyFont: { family: "JetBrains Mono, monospace", size: 12 },
              borderWidth: 0,
              padding: 10,
              displayColors: false,
              callbacks: { label: c => fmt$(c.parsed.y) }
            }
          },
          scales: {
            x: {
              ticks: { color: t.text, font: { family: "JetBrains Mono, monospace", size: 10 }, maxRotation: 0, autoSkipPadding: 32 },
              grid: { display: false },
              border: { color: t.border },
            },
            y: {
              ticks: { color: t.text, font: { family: "JetBrains Mono, monospace", size: 10 }, callback: v => fmt$0(v) },
              grid: { color: t.grid, drawTicks: false },
              border: { display: false },
            },
          },
        },
      });
    }

    document.addEventListener("themechange", () => { if (DASHBOARD) drawChart(currentRange()); });
    function currentRange() {
      const active = document.querySelector("#range-tabs .range-tab.active");
      return active ? active.dataset.r : "all";
    }

    async function load() {
      const data = await api("GET", "/api/dashboard");
      DASHBOARD = data;
      const s = data.summary;

      document.getElementById("tax-year-eyebrow").textContent = `Tax Year ${data.settings.tax_year}`;

      const yrSel = document.getElementById("year-select");
      [2024, 2025, 2026].forEach(y => {
        const o = document.createElement("option");
        o.value = y; o.textContent = `Tax year ${y}`;
        if (y === data.settings.tax_year) o.selected = true;
        yrSel.appendChild(o);
      });
      yrSel.addEventListener("change", async e => {
        await api("PUT", "/api/settings", { ...(await api("GET","/api/settings")), tax_year: parseInt(e.target.value) });
        location.reload();
      });

      if (data.tx_count === 0) {
        document.getElementById("empty-state").style.display = "block";
        return;
      }
      document.getElementById("dashboard-body").style.display = "block";

      document.getElementById("k-sales").textContent = fmt$0(s.gross_receipts);
      document.getElementById("k-sales-sub").textContent = `${data.tx_count} transaction${data.tx_count === 1 ? "" : "s"}`;
      document.getElementById("k-basis").textContent = fmt$0(s.total_basis);
      document.getElementById("k-basis-sub").textContent = "Purchase, grading, shipping";

      const netEl = document.getElementById("k-net");
      netEl.textContent = fmt$0(s.total_net);
      netEl.className = "kpi-value " + gainCls(s.total_net);
      const marg = s.gross_receipts ? s.total_net / s.gross_receipts : 0;
      document.getElementById("k-net-delta").innerHTML = marg
        ? `<span class="${gainCls(marg)}">${marg > 0 ? "+" : ""}${fmtPct(marg)}</span> <span class="tertiary">margin</span>`
        : `<span class="tertiary">—</span>`;

      document.getElementById("k-tax").textContent = fmt$0(s.estimated_total_tax);
      const stBit = data.settings.state ? `${data.settings.state}` : "no state set";
      const ctyBit = data.settings.city ? ` · ${data.settings.city.split(":").pop()}` : "";
      document.getElementById("k-tax-sub").textContent = `Federal + state${ctyBit} · ${stBit}`;

      const items = [];
      (data.alerts || []).forEach(a => items.push({ title: a.title, detail: a.detail }));
      (data.suggestions || []).forEach(sg => items.push({ title: sg.headline, detail: sg.detail }));
      const actEl = document.getElementById("action-items");
      if (!items.length) {
        actEl.innerHTML = `<div class="muted" style="font-size:13.5px;padding:8px 0">Nothing requires your attention.</div>`;
      } else {
        actEl.innerHTML = items.slice(0, 5).map(i => `
          <div class="action-item">
            <div class="action-item-title">${i.title}</div>
            <div class="action-item-detail">${i.detail}</div>
          </div>
        `).join("");
      }

      const rows = await api("GET", "/api/transactions");
      const recent = rows.slice(0, 8);
      document.getElementById("recent-body").innerHTML = recent.map(r => {
        const hold = r.holding_period_days == null ? `<span class="muted">—</span>` :
          `<span class="badge ${r.is_long_term ? "badge-gain" : "badge-warning"}">${r.is_long_term ? "LT" : "ST"}</span>`;
        return `<tr>
          <td class="muted mono">${fmtDate(r.sale_date)}</td>
          <td>${escHtml(r.item_title)}</td>
          <td class="muted">${escHtml(r.platform_source || "manual")}</td>
          <td>${hold}</td>
          <td class="num">${fmt$(r.net_proceeds)}</td>
          <td class="num ${gainCls(r.gain_loss)}">${fmt$(r.gain_loss)}</td>
        </tr>`;
      }).join("");

      drawChart("all");
      document.querySelectorAll("#range-tabs .range-tab").forEach(b => {
        b.addEventListener("click", () => {
          document.querySelectorAll("#range-tabs .range-tab").forEach(x => x.classList.remove("active"));
          b.classList.add("active");
          drawChart(b.dataset.r);
        });
      });
    }
    load().catch(e => { console.error(e); toast(e.message, "error"); });
  </script>
</body>
</html>
