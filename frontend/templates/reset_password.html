<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Set new password · CardTax</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
  <meta name="theme-color" content="#faf8f3" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#14130f" media="(prefers-color-scheme: dark)">
  <meta name="description" content="Set a new password for your CardTax account.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="CardTax">
  <meta property="og:title" content="Reset your password">
  <meta property="og:description" content="Set a new password for your CardTax account.">
  <meta property="og:image" content="/static/og-image.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Reset your password">
  <meta name="twitter:description" content="Set a new password for your CardTax account.">
  <meta name="twitter:image" content="/static/og-image.png">
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/analytics.js" defer></script>
</head>
<body>
  <div class="auth-shell">
    <header class="auth-topbar">
      <a href="/" class="brand">CardTax</a>
      <a href="/login" class="muted" style="font-size:13px">Back to sign in →</a>
    </header>

    <main class="auth-main">
      <div class="auth-card">
        <h1 class="auth-title">Set a new password</h1>
        <p class="auth-sub" id="sub-text">Pick a new password for your CardTax account.</p>

        <div id="error-banner" class="note note-danger" style="display:none;margin-bottom:18px"></div>

        <div id="invalid-block" style="display:none">
          <div class="note note-danger" style="margin-bottom:18px">
            <strong id="invalid-title">This reset link can't be used.</strong>
            <div id="invalid-detail" style="margin-top:6px;font-size:12.5px"></div>
          </div>
          <a href="/forgot-password" class="btn btn-primary" style="width:100%">Request a new link</a>
        </div>

        <form id="reset-form" autocomplete="on" style="display:none">
          <label class="field" style="margin-bottom:14px">
            <span class="field-label">New password</span>
            <input type="password" id="password" class="input" autocomplete="new-password" minlength="8" required>
            <span class="field-help">At least 8 characters.</span>
          </label>
          <label class="field" style="margin-bottom:18px">
            <span class="field-label">Confirm new password</span>
            <input type="password" id="password2" class="input" autocomplete="new-password" minlength="8" required>
          </label>
          <button class="btn btn-primary" id="submit" style="width:100%" type="submit">Update password</button>
        </form>

        <div id="success-block" style="display:none">
          <div class="note" style="border-left-color:var(--gain);margin-bottom:18px">
            <strong>Password updated.</strong> You can now sign in with your new password.
          </div>
          <a href="/login" class="btn btn-primary" style="width:100%">Continue to sign in</a>
        </div>

        <div class="auth-foot muted">
          <a href="/login">Back to sign in</a>
        </div>
      </div>
    </main>

    <footer class="auth-footer muted">
      <span>© <span id="year"></span> CardTax</span>
      <span><a href="/terms">Terms</a> · <a href="/privacy">Privacy</a> · <a href="/pricing">Pricing</a></span>
    </footer>
  </div>

  <script>
    (function () {
      const saved = localStorage.getItem("cardtax-theme");
      const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
      if (saved === "dark" || (saved !== "light" && prefersDark)) {
        document.documentElement.classList.add("dark");
      }
    })();
    document.getElementById("year").textContent = new Date().getFullYear();

    const params = new URLSearchParams(window.location.search);
    const token = params.get("token") || "";

    function showError(msg) {
      const b = document.getElementById("error-banner");
      b.textContent = msg; b.style.display = "block";
    }
    function clearError() { document.getElementById("error-banner").style.display = "none"; }

    function showInvalid(reason) {
      document.getElementById("reset-form").style.display = "none";
      document.getElementById("invalid-block").style.display = "block";
      const detail = ({
        invalid: "We couldn't find this reset link. It may have been mistyped.",
        used: "This link has already been used. Request a new one if you need to reset again.",
        expired: "This link has expired. Reset links are good for one hour.",
      })[reason] || "This link can't be used.";
      document.getElementById("invalid-detail").textContent = detail;
    }

    async function init() {
      if (!token) { showInvalid("invalid"); return; }
      try {
        const r = await fetch("/api/auth/reset/check?token=" + encodeURIComponent(token));
        const data = await r.json();
        if (!data.valid) { showInvalid(data.reason || "invalid"); return; }
        document.getElementById("reset-form").style.display = "block";
      } catch {
        showInvalid("invalid");
      }
    }
    init();

    document.getElementById("reset-form").addEventListener("submit", async e => {
      e.preventDefault();
      clearError();
      const pw  = document.getElementById("password").value;
      const pw2 = document.getElementById("password2").value;
      if (pw.length < 8) { showError("Password must be at least 8 characters."); return; }
      if (pw !== pw2)    { showError("Passwords do not match."); return; }
      const btn = document.getElementById("submit");
      btn.disabled = true; btn.textContent = "Updating…";
      try {
        const r = await fetch("/api/auth/reset", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ token, new_password: pw }),
        });
        const data = await r.json().catch(() => ({}));
        if (!r.ok) throw new Error(data.detail || "Could not reset password.");
        document.getElementById("reset-form").style.display = "none";
        document.getElementById("success-block").style.display = "block";
        document.getElementById("sub-text").textContent = "All done — your password has been changed.";
      } catch (err) {
        showError(err.message || "Could not reset password.");
        btn.disabled = false; btn.textContent = "Update password";
      }
    });
  </script>
</body>
</html>
